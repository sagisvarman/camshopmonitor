<!doctype html>
<!--
=====================================================================
WASH MAT REPORT: Firestore reporting page (static, no build step)
=====================================================================
FILES
 index.html      the markup; css/app.css the styles
 js/main.js      sign-in, boot, event wiring (the page's entry module)
 js/config.js    Firebase project, sign-in, currency, limits, demo mode
 js/i18n.js      page text in English and Bahasa Indonesia
 js/data.js      reading Firestore and normalising its documents
 js/shop.js, firebase.js, state.js, render.js, charts.js, util.js, demo.js
 js/tabs/*.js    one module per tab

SETUP
 1. Fill in FIREBASE_CONFIG in js/config.js (apiKey, authDomain, projectId,
    appId). Firebase Console > Project settings > Your apps > Web app.
 2. Firebase Console > Authentication: enable Google and/or Email/Password,
    add your Vercel domain under Settings > Authorized domains.
 3. Publish the Firestore security rules (firestore.rules, next to app.py):
    read-only, all client writes denied except the CCTV tab's
    track_visits/{shop}/cctv_watch/latest (field "at" = request.time only)
    and the Review tab's fix requests (track_visits/{shop}/edit_requests).
 4. Deploy the folder to Vercel (CLI: `vercel --prod`, or connect a Git repo).

SHOPS AND LOGINS
 - Each shop's logins are made on the Mac app's Settings page (shop_logins.py).
   A login carries its shop's id (a "shop" claim), and sees only that shop:
   the page reads it from the login, and the rules refuse every other shop.
 - The owner (the email in firestore.rules' isAllowed) sees every shop, with a
   shop picker in the header.
 - A shop's name and time zone come from its document, track_visits/{shop}
   (saved by the Settings page): the report's title, and which day is today.

DEMO MODE
 - While FIREBASE_CONFIG still has YOUR_... placeholders, or when the URL has
   ?demo=1, the page skips sign-in and shows generated sample data.

DATA
 - Reads only track_visits/{SHOP_ID}/devices/{device}/days/{DD-MM-YYYY}/vehicles
   and .../zones, only where source is "overlay", "emulator" or "video"
   (recordings counted on Colab by video_processor.py). Never writes, except
   the CCTV tab's "someone is watching" time (see cctv_feed.py) and the
   Review tab's fix requests.
 - The Review tab shows one day's bikes with their photos (.../days/{date}/
   photos, sent by review_photos.py) and lets the shop merge two ids that were
   one bike, or take out a bike that only parked. It adds a request to
   track_visits/{SHOP_ID}/edit_requests; the counting computer makes the fix
   (edit_requests.py) and rewrites the bikes' documents. Which ids were merged
   or taken out, and by whom: .../devices/{device}/edits/{session}.
 - The CCTV tab listens to track_visits/{SHOP_ID}/cctv/{device}: each emulator's
   plain camera picture, sent every few seconds only while the tab is open.
 - The devices are listed from track_visits/{SHOP_ID}/devices. Date documents do
   not exist, so every date key in the range is built and read directly for each
   device (max 60 days). Results are cached in memory until you press Refresh.
 - Times shown are time_str values as stored (shop local time, no conversion).
 - Older documents may lack on_mat, zones_visited, visit_start_time, plate_text
   and the visits map. They are treated as optional; when on_mat is missing a
   visit counts as a wash if its zone is set.
=====================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Wash mat report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="auth" class="center" hidden>
  <div class="card">
    <div class="card-lang"><div class="seg lang" role="group"></div></div>
    <h1 data-i18n="title">Wash mat report</h1>
    <p data-i18n="signInLead">Sign in to see motorbike detections and washes.</p>
    <button class="btn primary" id="googleBtn" type="button" data-i18n="googleBtn">Sign in with Google</button>
    <div class="or" data-i18n="orEmail">or use email and password</div>
    <form id="pwForm" novalidate>
      <label for="em" data-i18n="email">Email</label>
      <input id="em" type="email" autocomplete="username" required>
      <label for="pw" data-i18n="password">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <div style="height:14px"></div>
      <button class="btn" type="submit" data-i18n="signIn">Sign in</button>
    </form>
    <div class="msg" id="authMsg" role="alert"></div>
  </div>
</div>

<div id="denied" class="center" hidden>
  <div class="card">
    <div class="card-lang"><div class="seg lang" role="group"></div></div>
    <h1 data-i18n="notAllowed">Not allowed</h1>
    <p><span data-i18n="deniedPre">You are signed in as </span><b id="deniedWho"></b><span data-i18n="deniedPost">, but this account is not on the access list. Ask the owner to add your email, then sign in again.</span></p>
    <button class="btn primary" id="deniedOut" type="button" data-i18n="signOut">Sign out</button>
  </div>
</div>

<div id="app" class="wrap" hidden>
  <header class="top">
    <div class="brand" data-i18n="title">Wash mat report</div>
    <span class="shop" id="shopName"></span>
    <select id="shopPick" aria-label="Shop" data-i18n-label="shop" hidden></select>
    <span class="tag" id="demoTag" data-i18n="demoData" hidden>Demo data</span>
    <div class="seg lang" role="group"></div>
    <div class="who" id="whoBox"><span id="who"></span><button class="btn" id="signOut" type="button" data-i18n="signOut">Sign out</button></div>
  </header>

  <section class="controls" aria-label="Date range" data-i18n-label="dateRange">
    <div class="seg" id="presets" role="group" aria-label="Range presets" data-i18n-label="rangePresets">
      <button type="button" data-p="today" aria-pressed="false" data-i18n="today">Today</button>
      <button type="button" data-p="7" aria-pressed="true" data-i18n="last7">Last 7 days</button>
      <button type="button" data-p="30" aria-pressed="false" data-i18n="last30">Last 30 days</button>
      <button type="button" data-p="custom" aria-pressed="false" data-i18n="custom">Custom</button>
    </div>
    <div class="dates" id="customDates" hidden>
      <input type="date" id="dFrom" aria-label="From date" data-i18n-label="fromDate">
      <span data-i18n="to">to</span>
      <input type="date" id="dTo" aria-label="To date" data-i18n-label="toDate">
      <button class="btn" id="applyRange" type="button" data-i18n="apply">Apply</button>
    </div>
    <button class="btn" id="refresh" type="button" data-i18n="refresh">Refresh</button>
  </section>
  <p class="status" id="status" role="status"></p>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Reports" data-i18n-label="reports"></nav>
  <main id="panel"></main>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
