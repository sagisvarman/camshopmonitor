<!doctype html>
<!--
=====================================================================
WASH MAT REPORT: single-file Firestore reporting page
=====================================================================
SETUP
 1. Fill in FIREBASE_CONFIG near the top of the <script> (apiKey, authDomain,
    projectId, appId). Firebase Console > Project settings > Your apps > Web app.
 2. Firebase Console > Authentication: enable Google and/or Email/Password,
    add your Vercel domain under Settings > Authorized domains, add users.
 3. Publish the Firestore security rules (see the chat reply): read-only,
    allowlisted emails only, all client writes denied.
 4. Deploy this one file to Vercel (CLI: `vercel --prod`, or connect a Git repo).

DEMO MODE
 - While FIREBASE_CONFIG still has YOUR_... placeholders, or when the URL has
   ?demo=1, the page skips sign-in and shows generated sample data.

DATA
 - Reads only track_visits/{DD-MM-YYYY}/vehicles and zone_status/{DD-MM-YYYY}/zones,
   only where source is "overlay" or "emulator". Never writes.
 - Date documents do not exist, so every date key in the range is built and read
   directly (max 60 days). Results are cached in memory until you press Refresh.
 - Times shown are time_str values as stored (shop local time, no conversion).
 - Older documents may lack on_mat, zones_visited, visit_start_time, plate_text
   and the visits map. They are treated as optional; when on_mat is missing a
   visit counts as a wash if its zone is set.
=====================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Wash mat report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style id="appCss">
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#222222; --muted:#666666; --line:#cfcfcf;
  --wash:#2b6cb0; --wash-soft:#e3edf7; --off:#9a9a9a; --warn:#b26a00; --warn-soft:#fff3d6;
  --bad:#b00020; --bad-soft:#fde8e8; --focus:#2b6cb0;
  --head:Arial,Helvetica,sans-serif;
  --body:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--body);overflow-x:hidden}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.2}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:14px 14px 48px}
.num{font-variant-numeric:tabular-nums}

/* header and controls */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand{font:700 20px/1 var(--head)}
.tag{font-size:12px;font-weight:600;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border:1px solid var(--warn)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.top .lang{margin-left:auto}
.lang button{padding:4px 10px;font-size:12px}
.btn{background:#f3f3f3;border:1px solid #b5b5b5;border-radius:3px;padding:6px 12px}
.btn:hover{background:#e8e8e8}
.btn.primary{background:var(--wash);border-color:var(--wash);color:#fff}
.btn.primary:hover{background:#245a96}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid #b5b5b5;border-radius:3px;overflow:hidden;background:#fff}
.seg button{border:0;background:#f3f3f3;padding:6px 12px;border-right:1px solid #b5b5b5}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--wash);color:#fff;font-weight:700}
.dates{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input[type=date],input[type=text],input[type=email],input[type=password],input[type=search],select{
  background:#fff;border:1px solid #b5b5b5;border-radius:3px;padding:6px 8px;min-width:0}
.status{margin:10px 0 0;font-size:12px;color:var(--muted)}
.status.warn{color:var(--warn)}
.status.err{color:var(--bad)}

/* tabs */
.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);margin:12px 0 16px}
.tabs button{flex:0 0 auto;border:0;background:transparent;padding:9px 14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}

/* summary */
.hero{font:700 22px/1.25 var(--head);margin:4px 0 4px}
.hero .n{color:var(--ink)}
.sub{color:var(--muted);margin:0 0 14px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 18px}
.strip div{background:#fff;padding:10px 14px}
.strip b{display:block;font:700 20px/1.2 var(--head)}
.strip span{font-size:12px;color:var(--muted)}
.box{background:#fff;border:1px solid var(--line);padding:14px;margin:0 0 18px}
.box h2{font-size:16px;margin-bottom:10px}
.chartbox{position:relative;height:250px}
.note{background:var(--warn-soft);border:1px solid #e6c97a;padding:8px 12px;margin:0 0 14px;font-size:13px}
.empty{background:#fafafa;border:1px solid var(--line);padding:24px 16px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);display:block;margin-bottom:4px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;white-space:nowrap;border:1px solid #e0e0e0}
th{font-weight:700;color:var(--ink);background:#f0f0f0;border-color:#cfcfcf}
tbody tr:nth-child(even) td{background:#fafafa}
th.r,td.r{text-align:right}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
tr.row{cursor:pointer}
tr.row:hover td{background:#eef4fb}
tr.dim td{color:#999}
tr.detail td{background:#f6f9fd!important;white-space:normal}
.pill{display:inline-block;padding:0 6px;border-radius:2px;font-size:12px;font-weight:700}
.pill.wash{background:var(--wash-soft);color:var(--wash)}
.pill.off{background:#ececec;color:#555}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.warnicon{color:var(--warn);cursor:help}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.filters label{display:inline-flex;gap:6px;align-items:center}
.filters .grow{flex:1 1 150px}
.count{font-size:12px;color:var(--muted);margin:0 0 8px}
.more{display:block;margin:12px auto 0}

/* timeline */
.tl-row{display:grid;grid-template-columns:104px 1fr;align-items:center;min-height:26px}
.tl-label{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.tl-track{position:relative;height:18px;margin:0 14px;background-image:linear-gradient(to right,#e3e3e3 1px,transparent 1px);background-size:calc(100% / var(--n)) 100%}
.tl-axis{position:relative;height:20px;margin:0 14px}
.tl-axis i{position:absolute;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--muted)}
.tl-bar{position:absolute;top:3px;height:12px;border-radius:2px;background:var(--wash)}
.tl-bar.off{background:var(--off)}
.tl-bar.open{background:repeating-linear-gradient(90deg,var(--wash) 0 6px,transparent 6px 9px)}
.tl-bar.off.open{background:repeating-linear-gradient(90deg,var(--off) 0 6px,transparent 6px 9px)}
.tl-bar.flag{outline:2px solid var(--warn);outline-offset:1px}
.tl-zone{font:700 13px var(--head);margin:14px 0 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
.legend i{display:inline-block;width:14px;height:8px;margin-right:5px;vertical-align:middle}
@media (max-width:640px){.tl-axis i.minor{display:none}.tl-row{grid-template-columns:78px 1fr}}

/* heatmap */
.heat{display:grid;gap:2px;min-width:max-content;font-size:12px}
.heat .c{height:26px;min-width:26px;display:flex;align-items:center;justify-content:center;background:#f4f4f4}
.heat .h{color:var(--muted);text-align:center}
.heat .d{color:var(--muted);padding-right:8px;display:flex;align-items:center}
.bar{height:8px;background:var(--wash);min-width:2px}

/* weekly report: an A4 sheet on screen, the only thing printed */
body.wk-mode #presets,body.wk-mode #customDates{display:none!important}
.wk-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.wk-bar label{display:inline-flex;gap:6px;align-items:center}
.sheet{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);box-shadow:0 1px 6px rgba(0,0,0,.08);padding:28px 32px;font-size:13px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
.sh-shop{font:700 24px/1.15 var(--head)}
.sh-title{font-size:14px;color:var(--muted);margin-top:3px}
.sh-meta{text-align:right;font-size:12px;color:var(--muted)}
.sh-meta b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
.sh-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 14px}
.sh-kpis div{background:#fff;padding:10px 12px}
.sh-kpis div:first-child{grid-column:span 2}
.sh-kpis b{display:block;font:700 22px/1.15 var(--head)}
.sh-kpis span{font-size:12px;color:var(--muted)}
.sh-kpis small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sh-box{border:1px solid var(--line);padding:12px 14px;margin:0 0 14px;break-inside:avoid}
.sh-box h3{font-size:14px;margin:0 0 10px}
.sh-box table{font-size:12px}
.sh-box th,.sh-box td{padding:5px 8px}
.vbars{display:flex;gap:4px;align-items:flex-end}
.vbar{flex:1 1 0;min-width:0;text-align:center;font-size:11px;color:var(--muted)}
.vbar .plot{height:126px;padding-top:16px;display:flex;flex-direction:column;justify-content:flex-end}
.vbar .v{font-weight:700;color:var(--ink);margin-bottom:2px}
.vbar .w{background:var(--wash)}
.vbar .lbl{margin-top:4px;white-space:nowrap;overflow:hidden}
.hbars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;font-size:12px}
.hbars .bar{height:10px;min-width:0}
.sh-legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:8px}
.sh-legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.sh-notes{font-size:12px;margin:0 0 14px;padding:8px 12px;background:var(--warn-soft);border:1px solid #e6c97a}
.sh-notes p{margin:0}
.sh-notes p+p{margin-top:4px}
.sh-empty{padding:28px 0;text-align:center;color:var(--muted)}
.sh-foot{border-top:1px solid var(--line);padding-top:8px;font-size:11px;color:var(--muted)}
@media (max-width:640px){.sheet{padding:16px}.sh-kpis{grid-template-columns:repeat(2,1fr)}.sh-grid{grid-template-columns:1fr}.sh-head{flex-direction:column;align-items:flex-start}.sh-meta{text-align:left}}
/* .compact: tighter than on screen, so the summary fits on the first A4
   page; added to the sheet for printing and for the PDF. .pdf: flat sheet. */
.sheet.compact .sh-head{margin-bottom:10px;padding-bottom:8px}
.sheet.compact .sh-shop{font-size:22px}
.sheet.compact .sh-kpis{margin-bottom:10px}
.sheet.compact .sh-kpis div{padding:7px 10px}
.sheet.compact .sh-kpis b{font-size:19px}
.sheet.compact .sh-notes{margin-bottom:10px;padding:6px 10px}
.sheet.compact .sh-grid{gap:10px}
.sheet.compact .sh-box{padding:9px 12px;margin-bottom:10px}
.sheet.compact .sh-box h3{margin-bottom:7px}
.sheet.compact .sh-box th,.sheet.compact .sh-box td{padding:3px 8px}
.sheet.compact .vbar .plot{height:100px}
.sheet.compact .hbars{gap:4px 8px}
.sheet.pdf{max-width:none;border:0;box-shadow:none;padding:0 2px}
@page{size:A4;margin:12mm}
@media print{
  body.wk-mode .top,body.wk-mode .controls,body.wk-mode .status,body.wk-mode .tabs,body.wk-mode .no-print{display:none!important}
  body.wk-mode .wrap{max-width:none;padding:0}
  body.wk-mode .sheet{max-width:none;border:0;box-shadow:none;padding:0}
  body.wk-mode tr{break-inside:avoid}
  body.wk-mode thead{display:table-header-group}
  body.wk-mode *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* auth */
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:24px;width:min(400px,100%)}
.card h1{font-size:22px;margin-bottom:6px}
.card p{color:var(--muted);margin:0 0 16px}
.card .btn{width:100%;padding:9px}
.card label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.card input{width:100%}
.or{text-align:center;color:var(--muted);font-size:13px;margin:14px 0 2px}
.msg{color:var(--bad);font-size:13px;min-height:20px;margin:10px 0 0}
.card-lang{display:flex;justify-content:flex-end;margin:-10px -10px 8px 0}
</style>
</head>
<body>

<div id="auth" class="center" hidden>
  <div class="card">
    <div class="card-lang"><div class="seg lang" role="group"></div></div>
    <h1 data-i18n="title">Wash mat report</h1>
    <p data-i18n="signInLead">Sign in to see motorbike detections and washes.</p>
    <button class="btn primary" id="googleBtn" type="button" data-i18n="googleBtn">Sign in with Google</button>
    <div class="or" data-i18n="orEmail">or use email and password</div>
    <form id="pwForm" novalidate>
      <label for="em" data-i18n="email">Email</label>
      <input id="em" type="email" autocomplete="username" required>
      <label for="pw" data-i18n="password">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <div style="height:14px"></div>
      <button class="btn" type="submit" data-i18n="signIn">Sign in</button>
    </form>
    <div class="msg" id="authMsg" role="alert"></div>
  </div>
</div>

<div id="denied" class="center" hidden>
  <div class="card">
    <div class="card-lang"><div class="seg lang" role="group"></div></div>
    <h1 data-i18n="notAllowed">Not allowed</h1>
    <p><span data-i18n="deniedPre">You are signed in as </span><b id="deniedWho"></b><span data-i18n="deniedPost">, but this account is not on the access list. Ask the owner to add your email, then sign in again.</span></p>
    <button class="btn primary" id="deniedOut" type="button" data-i18n="signOut">Sign out</button>
  </div>
</div>

<div id="app" class="wrap" hidden>
  <header class="top">
    <div class="brand" data-i18n="title">Wash mat report</div>
    <span class="tag" id="demoTag" data-i18n="demoData" hidden>Demo data</span>
    <div class="seg lang" role="group"></div>
    <div class="who" id="whoBox"><span id="who"></span><button class="btn" id="signOut" type="button" data-i18n="signOut">Sign out</button></div>
  </header>

  <section class="controls" aria-label="Date range" data-i18n-label="dateRange">
    <div class="seg" id="presets" role="group" aria-label="Range presets" data-i18n-label="rangePresets">
      <button type="button" data-p="today" aria-pressed="false" data-i18n="today">Today</button>
      <button type="button" data-p="7" aria-pressed="true" data-i18n="last7">Last 7 days</button>
      <button type="button" data-p="30" aria-pressed="false" data-i18n="last30">Last 30 days</button>
      <button type="button" data-p="custom" aria-pressed="false" data-i18n="custom">Custom</button>
    </div>
    <div class="dates" id="customDates" hidden>
      <input type="date" id="dFrom" aria-label="From date" data-i18n-label="fromDate">
      <span data-i18n="to">to</span>
      <input type="date" id="dTo" aria-label="To date" data-i18n-label="toDate">
      <button class="btn" id="applyRange" type="button" data-i18n="apply">Apply</button>
    </div>
    <button class="btn" id="refresh" type="button" data-i18n="refresh">Refresh</button>
  </section>
  <p class="status" id="status" role="status"></p>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Reports" data-i18n-label="reports"></nav>
  <main id="panel"></main>
</div>

<script>

/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */
const FIREBASE_CONFIG = {

    firstIn: 'First in', lastOut: 'Last out', flaggedDayTip: 'Includes visits closed after a crash or stop',

    /* visit log */

const SESSION_RE = /^(\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2})(?:_([A-Za-z0-9-]+))?$/;
function parseFeed(source, sessionId) {
  const m = SESSION_RE.exec(sessionId || '');
  const name = m ? (m[2] || 'default') : 'unknown';
  return { source: source || 'unknown', name, label: `${source || 'unknown'} / ${name}` };
}
const hasZone = z => z !== null && z !== undefined && String(z) !== '';

function normVisit(v, k, d, topOnMat) {
  const inEpoch = num(v.in_time) ?? (isFinite(+k) ? +k : null);
  const outEpoch = num(v.out_time);
  let inWall = wallMs(v.in_time_str), outWall = wallMs(v.out_time_str);
  const dur = num(v.duration_seconds);
  if (inWall == null && outWall != null) {
    if (dur != null) inWall = outWall - dur * 1000;
    else if (inEpoch != null && outEpoch != null) inWall = outWall - (outEpoch - inEpoch) * 1000;
  }
  if (outWall == null && inWall != null && outEpoch != null && inEpoch != null) outWall = inWall + (outEpoch - inEpoch) * 1000;
  const hasOut = outEpoch != null || outWall != null || dur != null;
  let duration = null;
  if (hasOut) duration = dur ?? ((inWall != null && outWall != null) ? (outWall - inWall) / 1000 : null);
  const zone = hasZone(v.zone) ? String(v.zone) : (hasZone(d.zone) ? String(d.zone) : null);
  let wash;
  if (typeof v.on_mat === 'boolean') wash = v.on_mat;
  else if (topOnMat !== null) wash = topOnMat;
  else wash = hasZone(v.zone ?? d.zone);
  return { inEpoch, outEpoch, inWall, outWall, hasOut, duration, zone, wash, plate: v.plate_text || null };
}

function normalizeBike(d, dateKey, docId) {
  const feed = parseFeed(d.source, d.session_id);
  const topOnMat = typeof d.on_mat === 'boolean' ? d.on_mat : null;
  const kindOut = d.kind === 'out' || d.status === 'departed';
  const topTs = num(d.timestamp), topWall = wallMs(d.time_str);
  let visits = [], legacy = false;

  if (d.visits && typeof d.visits === 'object' && Object.keys(d.visits).length) {
    visits = Object.entries(d.visits).sort((a, b) => (+a[0]) - (+b[0]))
      .map(([k, v]) => normVisit(v || {}, k, d, topOnMat));
  } else {
    /* Older document without a visits map: rebuild one visit from the top-level fields. */
    legacy = true;
    const dur = num(d.duration_seconds);
    const start = num(d.visit_start_time);
    const v = {};
    if (kindOut) {
      v.out_time = topTs; v.out_time_str = d.time_str; v.duration_seconds = dur;
      if (start != null) v.in_time = start;
      else if (dur != null && topTs != null) v.in_time = topTs - dur;
      if (topWall != null && dur != null) v.in_time_str = wallStr(topWall - dur * 1000);
      else if (topWall != null && start != null && topTs != null) v.in_time_str = wallStr(topWall - (topTs - start) * 1000);
    } else {
      v.in_time = start ?? topTs; v.in_time_str = d.time_str;
    }
    v.zone = d.zone; v.plate_text = d.plate_text;
    visits = [normVisit(v, String(Math.floor(v.in_time ?? 0)), d, topOnMat)];
  }

  const done = visits.filter(v => v.hasOut && v.duration != null);
  const ins = visits.map(v => v.inWall).filter(x => x != null);
  const outs = visits.map(v => v.outWall).filter(x => x != null);
  const zones = [];
  visits.forEach(v => { if (v.zone && !zones.includes(v.zone)) zones.push(v.zone); });
  (Array.isArray(d.zones_visited) ? d.zones_visited : []).forEach(z => { z = String(z); if (!zones.includes(z)) zones.push(z); });
  const lastZoned = [...visits].reverse().find(v => v.zone);
  const status = d.status || (d.kind === 'out' ? 'departed' : 'present');

  return {
    id: docId, date: dateKey, dayMs: keyMs(dateKey),
    sessionId: d.session_id || null, trackId: d.track_id ?? null,
    feed, source: d.source || 'unknown',
    plate: d.plate_text || (visits.find(v => v.plate) || {}).plate || null,
    visits, legacy, reason: d.reason || null, status, present: status === 'present',
    zone: lastZoned ? lastZoned.zone : (zones[0] || null), zones,
    wash: visits.some(v => v.wash),
    firstIn: ins.length ? Math.min(...ins) : null,
    lastOut: outs.length ? Math.max(...outs) : null,
    stay: sum(done.map(v => v.duration)), hasCompleted: done.length > 0
  };
}

function normalizeZoneDoc(d, dateKey, docId) {
  const feed = parseFeed(d.source, d.session_id);
  const occ = Object.entries(d.occupancies || {}).map(([k, o]) => {
    o = o || {};
    const since = num(o.since) ?? (isFinite(+k) ? +k : null), until = num(o.until);
    const dur = num(o.duration_seconds) ?? ((since != null && until != null) ? until - since : null);
    return { trackId: o.occupant_track_id ?? null, since, until, open: until == null && dur == null, dur };
  });
  return { id: docId, date: dateKey, zone: hasZone(d.zone) ? String(d.zone) : '?', sessionId: d.session_id || null, feed, status: d.status || null, occ };
}

/* ------------------------------------------------------------------ */
/* Loading data (Firestore, or generated demo data)                    */
/* ------------------------------------------------------------------ */
const cache = new Map(); /* dateKey -> { bikes, zones, nDocs } */
let db = null, FS = null, AU = null, auth = null;

async function fetchDay(key) {
  if (DEMO) return demoDay(key);
  const { collection, getDocs, query, where } = FS;
  const q1 = query(collection(db, 'track_visits', key, 'vehicles'), where('source', 'in', ALLOWED_SOURCES));
  const q2 = query(collection(db, 'zone_status', key, 'zones'), where('source', 'in', ALLOWED_SOURCES));
  const [a, b] = await Promise.all([getDocs(q1), getDocs(q2)]);
  return {
    vehicles: a.docs.map(x => ({ id: x.id, data: x.data() })),
    zones: b.docs.map(x => ({ id: x.id, data: x.data() }))
  };
}

async function loadDays(keys, force = false) {
  const todo = keys.filter(k => force || !cache.has(k));
  const results = await Promise.all(todo.map(async k => [k, await fetchDay(k)]));
  let docs = 0;
  for (const [k, r] of results) {
    const nDocs = r.vehicles.length + r.zones.length;
    docs += nDocs;
    cache.set(k, {
      bikes: r.vehicles.map(v => normalizeBike(v.data, k, v.id)),
      zones: r.zones.map(z => normalizeZoneDoc(z.data, k, z.id)),
      nDocs
    });
  }
  return { days: keys.length, read: todo.length, cached: keys.length - todo.length, docs };
}

/* ------------------------------------------------------------------ */
/* Demo data: same shapes as Firestore, generated deterministically     */
/* ------------------------------------------------------------------ */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const DEMO_FEEDS = [
  { source: 'overlay', name: null, zones: ['1', '2'], mult: 1 },
  { source: 'overlay', name: 'shopfront', zones: ['1', '2', '3'], mult: 0.8 },
  { source: 'emulator', name: 'phone1', zones: ['1', '2'], mult: 0.5 },
  { source: 'emulator', name: 'bikeB', zones: ['1'], mult: 0.4 }
];
const localStr = e => { const d = new Date(e * 1000); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const r1 = x => Math.round(x * 10) / 10;

function buildBikeDoc(feed, sid, track, visits, reason) {
  const last = visits[visits.length - 1], done = last.outE != null;
  const vmap = {};
  visits.forEach(v => {
    const o = { in_time: r1(v.inE), in_time_str: localStr(v.inE), zone: v.zone, on_mat: v.onMat };
    if (v.outE != null) { o.out_time = r1(v.outE); o.out_time_str = localStr(v.outE); o.duration_seconds = r1(v.outE - v.inE); }
    if (v.plate) o.plate_text = v.plate;
    vmap[String(Math.floor(v.inE))] = o;
  });
  const ts = done ? last.outE : last.inE;
  const doc = {
    source: feed.source, session_id: sid, track_id: track,
    kind: done ? 'out' : 'in', status: done ? 'departed' : 'present',
    timestamp: r1(ts), time_str: localStr(ts), visit_start_time: r1(last.inE),
    zone: last.zone, zones_visited: [...new Set(visits.map(v => v.zone).filter(Boolean))],
    on_mat: last.onMat, plate_text: last.plate || null,
    duration_seconds: done ? r1(last.outE - last.inE) : null,
    detected_at: r1(ts + 3.9), visits: vmap
  };
  if (reason) doc.reason = reason;
  return doc;
}

function demoDay(key) {
  const { d, m, y } = keyParts(key);
  const today = todayDate(), dayDate = new Date(y, m - 1, d);
  const ageDays = Math.round((today - dayDate) / 864e5);
  if (ageDays < 0) return { vehicles: [], zones: [] };
  const rng = mulberry32(hashStr(key)), isToday = ageDays === 0, nowE = Date.now() / 1000;
  const dayStart = dayDate.getTime() / 1000;
  const wk = [0, 6].includes(dayDate.getDay()) ? 1.4 : 1;
  const legacyDay = ageDays >= 20 && hashStr(key) % 3 === 0;
  const pick = a => a[Math.floor(rng() * a.length)];
  const gauss = (mu, sd) => { let u = 0; for (let k = 0; k < 6; k++) u += rng(); return mu + (u - 3) * sd * 1.41; };
  const vehicles = [], zoneMap = new Map();

  DEMO_FEEDS.forEach(feed => {
    const sid = `${y}-${pad(m)}-${pad(d)}_${pad(7 + Math.floor(rng() * 2))}-${pad(Math.floor(rng() * 60))}-${pad(Math.floor(rng() * 60))}${feed.name ? '_' + feed.name : ''}`;
    const count = Math.max(0, Math.round((5 + rng() * 9) * feed.mult * wk));
    let track = 1;
    for (let i = 0; i < count; i++) {
      track += 1 + Math.floor(rng() * 4);
      const r = rng();
      const hour = Math.min(20.5, Math.max(8, r < 0.45 ? gauss(11, 1.3) : r < 0.8 ? gauss(17, 1.5) : 8 + rng() * 12));
      const inE = dayStart + hour * 3600;
      const onMat = rng() < 0.86;
      const dur = onMat ? 240 + rng() * 480 : 300 + rng() * 2100;
      const plate = rng() < 0.35 ? `W${String.fromCharCode(65 + Math.floor(rng() * 26))}${String.fromCharCode(65 + Math.floor(rng() * 26))} ${1000 + Math.floor(rng() * 8999)}` : null;
      const visits = [{ inE, outE: inE + dur, zone: onMat ? pick(feed.zones) : null, onMat, plate }];
      if (rng() < 0.12) {
        const in2 = inE + dur + 1200 + rng() * 3600;
        visits.push({ inE: in2, outE: in2 + 200 + rng() * 400, zone: pick(feed.zones), onMat: true, plate });
      }
      let reason = null;
      if (!isToday && rng() < 0.05) {
        reason = pick(['detector_stopped', 'recovered']);
        const l = visits[visits.length - 1]; l.outE = l.inE + 30 + rng() * 90;
      }
      if (isToday) {
        if (visits[0].inE > nowE - 60) continue;
        const kept = [];
        for (const v of visits) {
          if (v.inE > nowE - 60) break;
          if (v.outE > nowE) { v.outE = null; kept.push(v); break; }
          kept.push(v);
        }
        visits.length = 0; visits.push(...kept);
      }
      let doc = buildBikeDoc(feed, sid, track, visits, reason);
      if (legacyDay) {
        doc = { source: doc.source, session_id: sid, track_id: track, kind: doc.kind, status: doc.status,
          timestamp: doc.timestamp, time_str: doc.time_str, zone: doc.zone, duration_seconds: doc.duration_seconds };
      }
      vehicles.push({ id: `${sid}_${track}`, data: doc });
      visits.forEach(v => {
        if (!v.zone || !v.onMat) return;
        const zid = `${sid}_${v.zone}`;
        if (!zoneMap.has(zid)) zoneMap.set(zid, { zone: v.zone, session_id: sid, source: feed.source, status: 'empty', occupancies: {}, time_str: localStr(v.inE), kind: 'zone_empty' });
        const z = zoneMap.get(zid), o = { occupant_track_id: track, since: r1(v.inE), since_str: localStr(v.inE) };
        if (v.outE != null) { o.until = r1(v.outE); o.until_str = localStr(v.outE); o.duration_seconds = r1(v.outE - v.inE); }
        else { z.status = 'occupied'; z.kind = 'zone_occupied'; }
        z.occupancies[String(Math.floor(v.inE))] = o;
      });
    }
  });

  if (isToday) { /* one bike that never got closed: should show as possibly stale */
    const inE = dayStart + 5 * 60 + 12, sid = `${y}-${pad(m)}-${pad(d)}_00-01-02`;
    vehicles.push({ id: `${sid}_99`, data: buildBikeDoc(DEMO_FEEDS[0], sid, 99, [{ inE, outE: null, zone: '2', onMat: true, plate: 'BQA 4410' }], null) });
  }
  /* records the page must ignore (filtered like where('source','in',...)) */
  vehicles.push({ id: 'ignored_1', data: { source: 'demo', session_id: `${y}-${pad(m)}-${pad(d)}_09-00-00`, track_id: 1, kind: 'out', status: 'departed', timestamp: dayStart + 36000, time_str: localStr(dayStart + 36000), zone: '1', duration_seconds: 300 } });
  vehicles.push({ id: 'ignored_2', data: { source: 'camera', session_id: `${y}-${pad(m)}-${pad(d)}_09-00-00`, track_id: 2, kind: 'out', status: 'departed', timestamp: dayStart + 36100, time_str: localStr(dayStart + 36100), zone: '2', duration_seconds: 200 } });
  const zones = [...zoneMap.entries()].map(([id, data]) => ({ id, data }));
  const ok = x => ALLOWED_SOURCES.includes(x.data.source);
  return { vehicles: vehicles.filter(ok), zones: zones.filter(ok) };
}

/* State                                                               */
/* ------------------------------------------------------------------ */
const state = {
  preset: '7', customStart: '', customEnd: '', keys: [], rangeText: '', loadSeq: 0, lastLoad: null,
  tab: 'summary',
  v: { feed: '', source: '', zone: '', washOnly: false, q: '', sort: 'in', dir: 'desc', limit: PAGE_SIZE, open: new Set() },
  tl: { day: '' }, dur: { washOnly: false, skipFlagged: false }, zn: { byFeed: false },
  wk: { start: '' }
};
let charts = [];

const rangeBikes = () => state.keys.flatMap(k => (cache.get(k) || {}).bikes || []);
const rangeZoneDocs = () => state.keys.flatMap(k => (cache.get(k) || {}).zones || []);

function computeRange() {
  const end = todayDate();
  let start, text;
  if (state.preset === 'today') { start = end; text = T.rangeToday; }
  else if (state.preset === '7') { start = addDays(end, -6); text = T.range7; }
  else if (state.preset === '30') { start = addDays(end, -29); text = T.range30; }
  else {
    if (!state.customStart || !state.customEnd) return { error: T.needDates };
    start = isoToDate(state.customStart);
    const e = isoToDate(state.customEnd);
    if (start > e) return { error: T.startAfterEnd };
    const days = Math.round((e - start) / 864e5) + 1;
    if (days > MAX_DAYS) return { error: T.tooManyDays(MAX_DAYS, days) };
    return { keys: keysBetween(start, e), text: T.rangeCustom(fmtDateShort(start), fmtDateShort(e)) };
  }
  return { keys: keysBetween(start, end), text };
}

function setStatus(msg, cls = '') { const s = $('#status'); s.textContent = msg; s.className = 'status ' + cls; }

async function refreshData(force = false) {
  const r = computeRange();
  if (r.error) { state.keys = []; setStatus(r.error, 'warn'); $('#panel').innerHTML = ''; return; }
  if (force) { r.keys.forEach(k => cache.delete(k)); cache.delete(dkey(todayDate())); }
  state.keys = r.keys; state.rangeText = r.text;
  const seq = ++state.loadSeq;
  setStatus(T.reading(r.keys.length));
  if (r.keys.some(k => !cache.has(k))) $('#panel').innerHTML = emptyBox(T.loading, T.fetching(r.text));
  try {
    const st = await loadDays(r.keys);
    if (seq !== state.loadSeq) return;
    state.lastLoad = st;
    const total = sum(r.keys.map(k => (cache.get(k) || {}).nDocs || 0));
    setStatus(T.loaded(r.keys.length, total, st, dataSrc()));
    renderPanel();
  } catch (e) {
    if (seq !== state.loadSeq) return;
    handleLoadError(e);
  }
}

function handleLoadError(e) {
  console.error(e);
  const denied = e && (e.code === 'permission-denied' || /insufficient permissions|permission-denied/i.test(String(e.message)));
  if (denied && REQUIRE_LOGIN) { showDenied(); return; }
  if (denied) {
    setStatus(T.refused, 'err');
    $('#panel').innerHTML = `<div class="empty"><b>${esc(T.rulesBlock)}</b>${esc(T.rulesBlockText)}<button class="btn" id="retry" type="button">${esc(T.tryAgain)}</button></div>`;
    $('#retry').onclick = () => refreshData(true);
    return;
  }
  setStatus(T.loadFailed(e && e.message ? e.message : e), 'err');
  $('#panel').innerHTML = `<div class="empty"><b>${esc(T.readError)}</b>${esc(T.readErrorText)}<button class="btn" id="retry" type="button">${esc(T.tryAgain)}</button></div>`;
  $('#retry').onclick = () => refreshData(true);
}

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function destroyCharts() { charts.forEach(c => c.destroy()); charts = []; }
function mkChart(id, cfg) {
  const el = document.getElementById(id);
  if (!el) return;
  if (!window.Chart) { el.parentElement.innerHTML = `<div class="empty">${esc(T.noChartLib)}</div>`; return; }
  const ink = cssVar('--muted'), line = cssVar('--line');
  Chart.defaults.color = ink; Chart.defaults.font.family = cssVar('--body');
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false }, cfg.options || {});
  cfg.options.scales = cfg.options.scales || {};
  Object.values(cfg.options.scales).forEach(s => { s.grid = Object.assign({ color: line }, s.grid || {}); });
  charts.push(new Chart(el, cfg));
}
const yInt = { beginAtZero: true, ticks: { precision: 0 } };

const TABS = ['summary', 'visits', 'timeline', 'hours', 'durations', 'zones', 'feeds', 'now', 'weekly'];

function buildTabs() {

}

/* ---- 1. Summary ---- */
function dayRows(keys = state.keys) {
  return keys.map(k => {
    const bikes = (cache.get(k) || {}).bikes || [];
    const washes = bikes.filter(b => b.wash).length;
    const stays = bikes.filter(b => b.hasCompleted).map(b => b.stay);
    const ins = bikes.map(b => b.firstIn).filter(x => x != null), outs = bikes.map(b => b.lastOut).filter(x => x != null);
    return { key: k, n: bikes.length, washes, off: bikes.length - washes, avg: avg(stays), med: median(stays),
      first: ins.length ? Math.min(...ins) : null, last: outs.length ? Math.max(...outs) : null,
      flagged: bikes.filter(b => b.reason).length, legacy: bikes.filter(b => b.legacy).length };
  });
}

function rSummary() {
  const rows = dayRows(), bikes = rangeBikes();
  if (!bikes.length) { $('#panel').innerHTML = noData(); return; }
  const washes = bikes.filter(b => b.wash).length, off = bikes.length - washes;
  const stays = bikes.filter(b => b.hasCompleted).map(b => b.stay);
  const flaggedDays = rows.filter(r => r.flagged), legacyN = sum(rows.map(r => r.legacy));
  let notes = '';
  if (flaggedDays.length) notes += `<p class="note"><b>${T.dataQuality}</b> ${esc(T.noteFlagged(flaggedDays.length, flaggedDays.map(r => keyLabel(r.key) + ': ' + r.flagged).join(', ')))}</p>`;
  if (legacyN) notes += `<p class="note"><b>${T.dataQuality}</b> ${esc(T.noteLegacy(legacyN))}</p>`;

  $('#panel').innerHTML = `
    <h1 class="hero"><span class="n num">${washes}</span> ${esc(T.heroWashes(washes, state.rangeText))}</h1>
    <p class="sub">${esc(T.heroSub(off, bikes.length))}</p>
    <div class="strip num">
      <div><b>${bikes.length}</b><span>${T.bikesSeen}</span></div>
      <div><b>${washes}</b><span>${T.washes}</span></div>
      <div><b>${off}</b><span>${T.offTheMats}</span></div>
      <div><b>${fmtDur(avg(stays))}</b><span>${T.avgStay}</span></div>
      <div><b>${fmtDur(median(stays))}</b><span>${T.medianStay}</span></div>
    </div>
    ${notes}
    <div class="box"><h2>${T.washesPerDay}</h2><div class="chartbox"><canvas id="cDay" aria-label="${T.washesPerDay}"></canvas></div></div>
    <div class="tw"><table class="num">
      <thead><tr><th>${T.day}</th><th class="r">${T.bikes}</th><th class="r">${T.avgStayShort}</th><th class="r">${T.median}</th><th class="r">${T.firstIn}</th><th class="r">${T.lastOut}</th></tr></thead>
      <tbody>${[...rows].reverse().map(r => `
        <tr class="${r.n ? '' : 'dim'}"><td>${esc(keyLabel(r.key))} ${r.flagged ? `<span class="warnicon" title="${T.flaggedDayTip}" aria-label="${T.flaggedDayTip}">&#9888;</span>` : ''}</td>
        <td class="r">${r.n}</td>
        <td class="r">${fmtDur(r.avg)}</td><td class="r">${fmtDur(r.med)}</td><td class="r">${fmtHM(r.first)}</td><td class="r">${fmtHM(r.last)}</td></tr>`).join('')}
      </tbody></table></div>`;
  mkChart('cDay', { type: 'bar', data: { labels: rows.map(r => keyLabel(r.key)), datasets: [
    { label: T.washes, data: rows.map(r => r.washes), backgroundColor: cssVar('--wash'), borderRadius: 3 },
    { label: T.offTheMats, data: rows.map(r => r.off), backgroundColor: cssVar('--off'), borderRadius: 3 }] },
    options: { scales: { x: { stacked: true, grid: { display: false } }, y: Object.assign({ stacked: true }, yInt) }, plugins: { legend: { position: 'bottom' } } } });
}

/* ---- 2. Visit log ---- */
const openVisit = b => { for (let i = b.visits.length - 1; i >= 0; i--) if (!b.visits[i].hasOut) return b.visits[i]; return b.visits[b.visits.length - 1]; };

function filterVisits() {

}

  const { sort, dir } = state.v, m = dir === 'asc' ? 1 : -1;

    const x = sortVal(a, sort), y = sortVal(b, sort);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === 'string' ? x.localeCompare(y, undefined, { numeric: true }) : x - y) * m;

}

function rVisits() {

      <label><input type="checkbox" id="fWash" ${f.washOnly ? 'checked' : ''}> ${T.washesOnly}</label>

function fillVisits() {

  }).join('') + `<th aria-label="${T.warning}"></th>`;

      <td class="num">#${esc(b.trackId ?? '?')}${b.visits.length > 1 ? ` <span class="pill off" title="${plural(b.visits.length, 'visit')}">x${b.visits.length}</span>` : ''}</td>
      <td>${esc(b.plate || '-')}</td><td class="num">${fmtHMS(b.firstIn)}</td><td class="num">${b.lastOut != null && !b.present ? fmtHMS(b.lastOut) : (b.lastOut != null ? fmtHMS(b.lastOut) : '-')}</td>

      <td>${b.reason ? `<span class="warnicon" title="${esc(T.closedTip(reasonText(b.reason)))}" aria-label="${esc(T.closedLabel(reasonText(b.reason)))}">&#9888;</span>` : ''}</td></tr>`;
    if (!open) return r;
    const vr = b.visits.map(v => `<tr><td class="num">${fmtHMS(v.inWall)}</td><td class="num">${fmtHMS(v.outWall)}</td><td class="num">${v.hasOut ? fmtDur(v.duration) : T.stillPresent}</td><td>${esc(v.zone || '-')}</td><td>${v.wash ? T.wash : T.offMats}</td></tr>`).join('');
    return r + `<tr class="detail"><td colspan="11"><div class="tw" style="max-width:520px"><table class="num"><thead><tr><th>${T.cols.in}</th><th>${T.cols.out}</th><th>${T.duration}</th><th>${T.cols.zone}</th><th>${T.cols.type}</th></tr></thead><tbody>${vr}</tbody></table></div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">${esc(T.detailNote(b.sessionId, b.id, b.legacy))}</div></td></tr>`;
  }).join('');
  $('#vTable').innerHTML = shown.length
    ? `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`
    : emptyBox(T.noMatches, T.noMatchesText);
  $('#vTable').onclick = e => {
    const s = e.target.closest('[data-s]');
    if (s) { const k = s.dataset.s; if (f.sort === k) f.dir = f.dir === 'asc' ? 'desc' : 'asc'; else { f.sort = k; f.dir = (k === 'date' || k === 'in' || k === 'out' || k === 'dur') ? 'desc' : 'asc'; } fillVisits(); return; }
    const tr = e.target.closest('tr.row');

}

function exportCsv() {
  const cell = v => { let s = v == null ? '' : String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['date', 'feed', 'source', 'session_id', 'track_id', 'plate', 'first_in', 'last_out', 'stay_seconds', 'zones', 'type', 'status', 'flag_reason', 'visits'];
  const lines = [head.join(',')];
  sortedVisits().forEach(b => lines.push([keyIso(b.date), b.feed.label, b.source, b.sessionId, b.trackId, b.plate,
    b.firstIn != null ? wallStr(b.firstIn) : '', b.lastOut != null ? wallStr(b.lastOut) : '', b.hasCompleted ? Math.round(b.stay) : '',
    b.zones.join(' '), b.wash ? T.csvWash : T.csvOff, statusLabel(b), b.reason || '', b.visits.length].map(cell).join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });

  a.download = `visits_${keyIso(state.keys[0])}_${keyIso(state.keys[state.keys.length - 1])}.csv`;

/* ---- 3. Day timeline ---- */
const zoneSort = (a, b) => a === '' ? 1 : b === '' ? -1 : a.localeCompare(b, undefined, { numeric: true });
function rTimeline() {
  const days = state.keys.filter(k => ((cache.get(k) || {}).bikes || []).length);
  if (!days.length) { $('#panel').innerHTML = noData(); return; }
  if (!days.includes(state.tl.day)) state.tl.day = days[days.length - 1];
  $('#panel').innerHTML = `
    <div class="filters"><select id="tlDay" aria-label="${T.day}">${[...days].reverse().map(k => `<option value="${esc(k)}" ${k === state.tl.day ? 'selected' : ''}>${esc(keyLabel(k))} (${cache.get(k).bikes.length})</option>`).join('')}</select></div>
    <div class="legend"><span><i style="background:var(--wash)"></i>${T.wash}</span><span><i style="background:var(--off)"></i>${T.offTheMats}</span>
      <span><i style="background:repeating-linear-gradient(90deg,var(--wash) 0 4px,transparent 4px 6px)"></i>${T.tlLegendOpen}</span><span><i style="border:2px solid var(--warn);height:4px"></i>${T.closedCrash}</span></div>
    <div class="box" id="tlBox"></div>`;
  $('#tlDay').onchange = e => { state.tl.day = e.target.value; fillTimeline(); };
  fillTimeline();
}
function fillTimeline() {
  const key = state.tl.day, bikes = cache.get(key).bikes, p = keyParts(key);
  const dayStart = Date.UTC(p.y, p.m - 1, p.d), dayEnd = dayStart + 864e5;
  const isToday = key === dkey(todayDate()), nowWall = toWallNow();
  const items = [];
  let skipped = 0;
  bikes.forEach(b => b.visits.forEach(v => {
    if (v.inWall == null) { skipped++; return; }
    const end = v.outWall ?? (isToday ? nowWall : null);
    items.push({ b, v, end });
  }));
  if (!items.length) { $('#tlBox').innerHTML = emptyBox(T.nothingToDraw, T.nothingToDrawText); return; }
  let lo = Math.max(dayStart, Math.min(...items.map(i => i.v.inWall)));
  let hi = Math.min(dayEnd, Math.max(...items.map(i => i.end ?? i.v.inWall + 36e5)));
  let t0 = dayStart + Math.floor((lo - dayStart) / 36e5) * 36e5, t1 = dayStart + Math.ceil((hi - dayStart) / 36e5) * 36e5;
  if (t1 - t0 < 72e5) { t1 = Math.min(dayEnd, t0 + 72e5); if (t1 - t0 < 72e5) t0 = t1 - 72e5; }
  const N = (t1 - t0) / 36e5, span = t1 - t0;
  const ticks = Array.from({ length: N + 1 }, (_, i) => `<i class="${i % 2 ? 'minor' : ''}" style="left:${i / N * 100}%">${pad(((t0 - dayStart) / 36e5 + i) % 24)}:00</i>`).join('');
  const groups = new Map();
  items.forEach(i => { const z = i.v.zone || ''; if (!groups.has(z)) groups.set(z, []); groups.get(z).push(i); });
  const body = [...groups.keys()].sort(zoneSort).map(z => {
    const rows = groups.get(z).sort((a, b) => a.v.inWall - b.v.inWall).map(({ b, v, end }) => {
      const s = Math.max(t0, v.inWall), e = Math.min(t1, end ?? t1);
      const left = (s - t0) / span * 100, width = Math.max(0.5, (e - s) / span * 100);
      const open = !v.hasOut;
      const tip = `#${b.trackId} ${b.feed.label}${b.plate ? ', ' + b.plate : ''}: ${fmtHMS(v.inWall)} ${T.to} ${v.hasOut ? fmtHMS(v.outWall) : T.stillPresent}${v.hasOut ? ', ' + fmtDur(v.duration) : ''}, ${v.wash ? T.washLc : T.offLc}${b.reason ? ', ' + T.closedAfter(reasonText(b.reason)) : ''}`;
      return `<div class="tl-row"><div class="tl-label" title="${esc(tip)}">#${esc(b.trackId)} ${esc(b.feed.name)}</div>
        <div class="tl-track" style="--n:${N}"><div class="tl-bar ${v.wash ? '' : 'off'} ${open ? 'open' : ''} ${b.reason ? 'flag' : ''}" style="left:${left}%;width:${width}%" role="img" tabindex="0" aria-label="${esc(tip)}" title="${esc(tip)}"></div></div></div>`;
    }).join('');
    return `<div class="tl-zone">${z ? esc(T.zoneN(z)) : T.noZoneOff}</div>${rows}`;
  }).join('');
  $('#tlBox').innerHTML = `<div class="tl-row"><div></div><div class="tl-axis">${ticks}</div></div>${body}${skipped ? `<p class="count">${T.notDrawn(skipped)}</p>` : ''}`;
}

/* ---- 4. Busy hours ---- */
function rHours() {
  const bikes = rangeBikes().filter(b => b.firstIn != null);
  if (!bikes.length) { $('#panel').innerHTML = noData(); return; }
  const byHour = Array(24).fill(0), heat = Array.from({ length: 7 }, () => Array(24).fill(0));
  bikes.forEach(b => { const d = new Date(b.firstIn), h = d.getUTCHours(); byHour[h]++; heat[(d.getUTCDay() + 6) % 7][h]++; });
  const act = byHour.map((c, h) => c ? h : -1).filter(h => h >= 0), h0 = Math.min(...act), h1 = Math.max(...act);
  const hours = Array.from({ length: h1 - h0 + 1 }, (_, i) => h0 + i);
  const peak = byHour.indexOf(Math.max(...byHour)), maxCell = Math.max(...heat.flat());
  const days = [1, 2, 3, 4, 5, 6, 0].map(i => T.weekdays[i]);
  $('#panel').innerHTML = `
    <h2 style="font-size:22px;margin-bottom:4px">${T.busiestHourIs(`${pad(peak)}:00`)}</h2>
    <p class="sub">${esc(T.hoursSub(byHour[peak], pad(peak), state.rangeText))}</p>
    <div class="box"><h2>${T.arrivalsByHourOfDay}</h2><div class="chartbox"><canvas id="cHour" aria-label="${T.arrivalsPerHour}"></canvas></div></div>
    <div class="box"><h2>${T.hourByWeekday}</h2><div class="tw" style="border:0"><div class="heat" style="grid-template-columns:44px repeat(${hours.length},minmax(26px,1fr))">
      <div></div>${hours.map(h => `<div class="h">${pad(h)}</div>`).join('')}
      ${heat.map((row, d) => `<div class="d">${days[d]}</div>${hours.map(h => { const c = row[h]; return `<div class="c num" title="${days[d]} ${pad(h)}:00, ${plural(c, 'arrival')}" style="${c ? `background:color-mix(in srgb,var(--wash) ${Math.round(14 + 86 * c / maxCell)}%,transparent)` : ''}">${c || ''}</div>`; }).join('')}`).join('')}
    </div></div></div>`;
  mkChart('cHour', { type: 'bar', data: { labels: hours.map(h => pad(h) + ':00'), datasets: [{ label: T.arrivals, data: hours.map(h => byHour[h]), backgroundColor: cssVar('--wash'), borderRadius: 3 }] },
    options: { scales: { x: { grid: { display: false } }, y: yInt }, plugins: { legend: { display: false } } } });
}

/* ---- 5. Duration stats ---- */
const statsOf = a => ({ n: a.length, avg: avg(a), med: median(a), max: a.length ? Math.max(...a) : null, min: a.length ? Math.min(...a) : null });
const STAY_BOUNDS = [[0, 180], [180, 300], [300, 480], [480, 720], [720, 1200], [1200, 2400], [2400, Infinity]];
const stayBuckets = () => STAY_BOUNDS.map(([a, z], i) => [T.stayBuckets[i], a, z]);
function rDurations() {
  if (!rangeBikes().length) { $('#panel').innerHTML = noData(); return; }

    <div class="filters">
      <label><input type="checkbox" id="dWash" ${f.washOnly ? 'checked' : ''}> ${T.washesOnly}</label>

  $('#dWash').onchange = e => { f.washOnly = e.target.checked; fillDurations(); };

}

      <div><b>${fmtDur(all.max)}</b><span>${T.longest}</span></div><div><b>${fmtDur(all.min)}</b><span>${T.shortest}</span></div><div><b>${all.n}</b><span>${T.bikesCounted}</span></div></div>

    <div class="tw"><table class="num"><thead><tr><th>${T.zone}</th><th class="r">${T.bikes}</th><th class="r">${T.average}</th><th class="r">${T.median}</th><th class="r">${T.longest}</th><th class="r">${T.shortest}</th></tr></thead><tbody>
      ${[...zoneMap.keys()].sort(zoneSort).map(z => { const s = statsOf(zoneMap.get(z)); return `<tr><td>${z ? esc(T.zoneN(z)) : T.noZone}</td><td class="r">${s.n}</td><td class="r">${fmtDur(s.avg)}</td><td class="r">${fmtDur(s.med)}</td><td class="r">${fmtDur(s.max)}</td><td class="r">${fmtDur(s.min)}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="count" style="margin-top:8px">${T.stayNote}</p>`;
  mkChart('cDur', { type: 'bar', data: { labels: buckets.map(b => b[0]), datasets: [{ label: T.bikes, data: buckets.map(([, a, z]) => set.filter(b => b.stay >= a && b.stay < z).length), backgroundColor: cssVar('--wash'), borderRadius: 3 }] },

  $('#panel').innerHTML = `
    <div class="box"><h2>${T.feedChart}</h2><div class="chartbox" style="height:${Math.max(180, rows.length * 56 + 70)}px"><canvas id="cFeed" aria-label="${T.totalsPerFeed}"></canvas></div></div>
    <div class="tw"><table class="num"><thead><tr><th>${T.feed}</th><th class="r">${T.bikes}</th><th class="r">${T.washes}</th><th class="r">${T.offMats}</th><th class="r">${T.avgStayShort}</th><th class="r">${T.sessions}</th><th class="r">${T.daysActive}</th><th class="r">${T.flagged}</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${esc(r.label)}</td><td class="r">${r.n}</td><td class="r">${r.washes}</td><td class="r">${r.off}</td><td class="r">${fmtDur(r.avg)}</td><td class="r">${r.sessions}</td><td class="r">${r.days}</td><td class="r">${r.flagged || '-'}</td></tr>`).join('')}
    </tbody></table></div><p class="count" style="margin-top:8px">${T.flaggedNote}</p>`;
  mkChart('cFeed', { type: 'bar', data: { labels: rows.map(r => r.label), datasets: [
    { label: T.washes, data: rows.map(r => r.washes), backgroundColor: cssVar('--wash'), borderRadius: 3 },
    { label: T.offTheMats, data: rows.map(r => r.off), backgroundColor: cssVar('--off'), borderRadius: 3 }] },
    options: { indexAxis: 'y', scales: { x: Object.assign({ stacked: true }, yInt), y: { stacked: true, grid: { display: false } } }, plugins: { legend: { position: 'bottom' } } } });
}

/* ---- 8. Present now ---- */
async function rNow() {
  const key = dkey(todayDate());
  $('#panel').innerHTML = emptyBox(T.loading, T.checkingNow);
  try {
    if (!cache.has(key)) { const st = await loadDays([key]); setStatus(T.readToday(st.docs, dataSrc())); }
  } catch (e) { handleLoadError(e); return; }
  if (state.tab !== 'now') return;
  const here = (cache.get(key) || {}).bikes.filter(b => b.present);
  const fresh = here.filter(b => !isStale(b)), stale = here.filter(isStale);
  const tbl = (list, stale) => `<div class="tw"><table class="num"><thead><tr><th>${T.feed}</th><th>${T.cols.bike}</th><th>${T.cols.plate}</th><th>${T.zone}</th><th>${T.cols.in}</th><th class="r">${stale ? T.openFor : T.soFar}</th></tr></thead><tbody>
    ${list.map(b => { const v = openVisit(b), age = presentAge(b); return `<tr><td>${esc(b.feed.label)}</td><td>#${esc(b.trackId)}</td><td>${esc(b.plate || '-')}</td><td>${esc((v && v.zone) || '-')}</td><td>${fmtHMS(v && v.inWall)}</td><td class="r">${age != null ? fmtDur(age) : '-'}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  $('#panel').innerHTML = `
    <h1 class="hero" style="max-width:none"><span class="n num">${fresh.length}</span> ${esc(T.heroNow(fresh.length))}</h1>
    <p class="sub">${esc(T.nowSub(key, STALE_HOURS))}</p>
    ${fresh.length ? tbl(fresh, false) : emptyBox(T.noneHere, T.noneHereText)}
    ${stale.length ? `<h2 style="margin:22px 0 8px;font-size:18px">${T.possiblyStale} (${stale.length})</h2>${tbl(stale, true)}` : ''}`;
}

/* ---- 9. Weekly report (printable) ---- */
/* Monday to Sunday, independent of the range picker; the week before is
   loaded too, for the comparison. Printing hides everything but .sheet. */
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const fmtDM = d => `${d.getDate()} ${T.months[d.getMonth()]}`;
const weekText = s => { const e = addDays(s, 6); return `${T.weekdays[1]} ${fmtDM(s)} ${T.to} ${T.weekdays[0]} ${fmtDM(e)} ${e.getFullYear()}`; };
const weekStarts = () => { const m = mondayOf(todayDate()); return Array.from({ length: 8 }, (_, i) => addDays(m, -7 * i)); };
const bikesIn = keys => keys.flatMap(k => (cache.get(k) || {}).bikes || []);
const washWord = n => plural(n, 'wash');

async function rWeekly() {
  const starts = weekStarts();
  if (!state.wk.start) state.wk.start = dateToIso(starts[1]);
  const startIso = state.wk.start, start = isoToDate(startIso);
  const keys = keysBetween(start, addDays(start, 6)), prevKeys = keysBetween(addDays(start, -7), addDays(start, -1));
  $('#panel').innerHTML = `
    <div class="wk-bar no-print">
      <label>${T.week} <select id="wkSel">${starts.map((s, i) => {
        const iso = dateToIso(s), e = addDays(s, 6), span = `${fmtDM(s)} ${T.to} ${fmtDM(e)} ${e.getFullYear()}`;
        const name = i === 0 ? T.thisWeek(span) : i === 1 ? T.lastWeek(span) : span;
        return `<option value="${iso}" ${iso === startIso ? 'selected' : ''}>${esc(name)}</option>`; }).join('')}</select></label>
      <button class="btn primary" id="wkPdf" type="button" disabled>${T.downloadPdf}</button>
      <button class="btn" id="wkPrint" type="button" disabled>${T.print}</button>
    </div>
    <div id="wkBody">${emptyBox(T.loading, T.fetchingWeek(weekText(start)))}</div>`;
  $('#wkSel').onchange = e => { state.wk.start = e.target.value; rWeekly(); };
  $('#wkPdf').onclick = downloadWeeklyPdf;
  $('#wkPrint').onclick = printWeekly;
  try {
    const st = await loadDays([...prevKeys, ...keys]);
    if (state.tab !== 'weekly' || state.wk.start !== startIso) return;
    setStatus(T.weeklyStatus(st, dataSrc()));
  } catch (e) {
    if (state.tab === 'weekly') handleLoadError(e);
    return;
  }
  fillWeekly(keys, prevKeys);
}

function fillWeekly(keys, prevKeys) {
  const start = isoToDate(state.wk.start);
  const bikes = bikesIn(keys), prev = bikesIn(prevKeys), rows = dayRows(keys);
  const now = new Date();
  const generated = `${fmtDateShort(now)}, ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const head = `<header class="sh-head">
      <div><div class="sh-shop">${esc(SHOP_NAME)}</div><div class="sh-title">${T.weeklyTitle}${DEMO ? ` &middot; <b>${T.sampleNotReal}</b>` : ''}</div></div>
      <div class="sh-meta"><b>${esc(weekText(start))}</b>${T.generated} ${esc(generated)}</div>
    </header>`;
  const foot = `<p class="sh-foot">${T.weeklyFoot}</p>`;
  $('#wkPdf').disabled = false;
  $('#wkPrint').disabled = false;
  if (!bikes.length) {
    $('#wkBody').innerHTML = `<article class="sheet">${head}<p class="sh-empty">${T.weekEmpty}</p>${foot}</article>`;
    return;
  }

  /* One total: bikes on the mats and off them are counted together. */
  const total = bikes.length;
  const washStays = bikes.filter(b => b.hasCompleted).map(b => b.stay);
  let vs = T.noPrevWeek;
  if (prev.length) {
    const d = total - prev.length, sign = d > 0 ? '+' : '';
    vs = d === 0 ? T.samePrevWeek : T.vsPrevWeek(`${sign}${d}`, `${sign}${Math.round(d / prev.length * 100)}`);
  }
  const best = rows.reduce((a, r) => (r.n > (a ? a.n : 0) ? r : a), null);

  const byHour = Array(24).fill(0);
  bikes.forEach(b => { if (b.firstIn != null) byHour[new Date(b.firstIn).getUTCHours()]++; });
  const act = byHour.map((c, h) => (c ? h : -1)).filter(h => h >= 0);
  const peak = act.length ? byHour.indexOf(Math.max(...byHour)) : null;
  const hours = act.length ? Array.from({ length: act[act.length - 1] - act[0] + 1 }, (_, i) => act[0] + i) : [];

  const maxDay = Math.max(1, ...rows.map(r => r.n)), maxHour = Math.max(1, ...byHour);
  const dayBars = rows.map(r => `<div class="vbar"><div class="plot"><div class="v">${r.n}</div>
      <div class="w" style="height:${r.n / maxDay * 100}%"></div></div>
      <div class="lbl">${esc(keyLabel(r.key).split(' ').slice(0, 2).join(' '))}</div></div>`).join('');
  const hourBars = hours.map(h => `<div class="vbar"><div class="plot"><div class="v">${byHour[h] || ''}</div>
      <div class="w" style="height:${byHour[h] / maxHour * 100}%"></div></div><div class="lbl">${pad(h)}</div></div>`).join('');

  const buckets = stayBuckets().map(([label, a, z]) => [label, washStays.filter(s => s >= a && s < z).length]);
  const maxBucket = Math.max(1, ...buckets.map(b => b[1]));

  const flagged = bikes.filter(b => b.reason).length, noOut = bikes.filter(b => b.present).length;
  const notes = [];
  if (flagged) notes.push(T.weekFlagged(flagged));
  if (noOut) notes.push(T.weekNoOut(noOut));

  $('#wkBody').innerHTML = `<article class="sheet">${head}
    <section class="sh-kpis num">
      <div><b>${total}</b><span>${T.totalWashes}</span><small>${esc(vs)}</small></div>
      <div><b>${fmtDur(median(washStays))}</b><span>${T.typicalWash}</span><small>${T.averageX(fmtDur(avg(washStays)))}</small></div>
      <div><b>${best ? esc(keyLabel(best.key)) : '-'}</b><span>${T.busiestDay}</span><small>${best ? washWord(best.n) : T.noWashes}</small></div>
      <div><b>${peak != null ? `${pad(peak)}:00` : '-'}</b><span>${T.busiestHour}</span><small>${peak != null ? T.inThatHour(byHour[peak]) : T.noArrivals}</small></div>
      <div><b>${T.daysOf7(rows.filter(r => r.n).length)}</b><span>${T.daysWithBikes}</span><small>${T.monToSun}</small></div>
    </section>
    ${notes.length ? `<div class="sh-notes">${notes.map(n => `<p>${esc(n)}</p>`).join('')}</div>` : ''}
    <div class="sh-grid">
      <section class="sh-box"><h3>${T.washesPerDay}</h3><div class="vbars">${dayBars}</div>
        <div class="sh-legend"><span>${T.dayTotalNote}</span></div></section>
      <section class="sh-box"><h3>${T.arrivalsByHour}</h3><div class="vbars">${hourBars}</div>
        <div class="sh-legend"><span>${T.oncePerDay}</span></div></section>
    </div>
    <section class="sh-box"><h3>${T.dayByDay}</h3><table class="num">
      <thead><tr><th>${T.day}</th><th class="r">${T.bikes}</th><th class="r">${T.avgStayShort}</th><th class="r">${T.median}</th><th class="r">${T.firstIn}</th><th class="r">${T.lastOut}</th></tr></thead>
      <tbody>${rows.map(r => `<tr class="${r.n ? '' : 'dim'}"><td>${esc(keyLabel(r.key))}</td><td class="r">${r.n}</td>
        <td class="r">${fmtDur(r.avg)}</td><td class="r">${fmtDur(r.med)}</td><td class="r">${fmtHM(r.first)}</td><td class="r">${fmtHM(r.last)}</td></tr>`).join('')}
        <tr><td><b>${T.week}</b></td><td class="r"><b>${bikes.length}</b></td><td colspan="4"></td></tr>
      </tbody></table></section>
    <section class="sh-box"><h3>${T.howLongWashes}</h3><div class="hbars num">${buckets.map(([label, c]) =>
      `<span>${esc(label)}</span><div class="bar" style="width:${c / maxBucket * 100}%"></div><b>${c}</b>`).join('')}</div></section>
    ${foot}
  </article>`;
}

const weeklyFileName = () => { const s = isoToDate(state.wk.start); return `${SHOP_NAME} ${T.weeklyFile} ${dateToIso(s)} ${T.to} ${dateToIso(addDays(s, 6))}`; };
const compactSheet = () => { const el = $('#wkBody .sheet').cloneNode(true); el.classList.add('compact'); return el; };

/* The PDF is built in the page and downloaded as a file, not saved from the
   print dialog: from the signed-in site, Chrome's print preview stuck on
   "Loading preview" (Firebase Auth's hidden cross-origin iframe), and its
   "Save as PDF" from a separate tab stuck on "Saving". html2pdf.js renders
   the sheet to images, so the PDF's text is not selectable. */
const PDF_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
let pdfLibLoad = null;
function loadPdfLib() {
  if (window.html2pdf) return Promise.resolve();
  pdfLibLoad = pdfLibLoad || new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = PDF_LIB;
    s.onload = ok;
    s.onerror = () => { pdfLibLoad = null; s.remove(); fail(new Error(T.pdfLibFailed)); };
    document.head.appendChild(s);
  });
  return pdfLibLoad;
}

function weeklyPdfWorker() {
  const el = compactSheet();
  el.classList.add('pdf');
  return html2pdf().set({
    margin: 12, filename: `${weeklyFileName()}.pdf`,
    image: { type: 'jpeg', quality: 0.95 },
    html2canvas: { scale: 2, backgroundColor: '#ffffff' },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css'], avoid: ['tr', '.sh-head', '.sh-kpis', '.sh-notes', '.sh-box', '.sh-foot'] }
  }).from(el);
}

async function downloadWeeklyPdf() {
  const btn = $('#wkPdf');
  btn.disabled = true; btn.textContent = T.makingPdf;
  try {
    await loadPdfLib();
    await weeklyPdfWorker().save();
    setStatus(T.pdfSaved(`${weeklyFileName()}.pdf`));
  } catch (e) {
    console.error(e);
    setStatus(T.pdfFailed(e && e.message ? e.message : e), 'err');
  } finally {
    btn.disabled = false; btn.textContent = T.downloadPdf;
  }
}

/* Printing on paper: the sheet alone in a new tab, away from the app's
   iframe, printed from that tab's own button. */
function printWeekly() {
  const w = window.open('', '_blank');
  if (!w) { /* popup blocked: print in place */
    const sheet = $('#wkBody .sheet');
    sheet.classList.add('compact');
    window.addEventListener('afterprint', () => sheet.classList.remove('compact'), { once: true });
    window.print();
    return;
  }
  w.document.open();
  w.document.write(`<!doctype html><html lang="${LANG}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light"><title>${esc(weeklyFileName())}</title><style>${$('#appCss').textContent}</style></head>
    <body class="wk-mode"><div class="wrap"><div class="wk-bar no-print"><button class="btn primary" type="button" onclick="window.print()">${T.print}</button>
    <span>${T.printHint}</span></div>${compactSheet().outerHTML}</div></body></html>`);
  w.document.close();
}

/* ------------------------------------------------------------------ */
/* Auth and boot                                                       */
/* ------------------------------------------------------------------ */
function show(id) { ['auth', 'denied', 'app'].forEach(x => { $('#' + x).hidden = x !== id; }); }
function showDenied() { const u = auth && auth.currentUser; $('#deniedWho').textContent = u ? u.email : T.thisAccount; show('denied'); }
function authMessage(e) {
  const c = e && e.code || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return T.authNoMatch;
  if (c === 'auth/too-many-requests') return T.authTooMany;
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return '';
  if (c === 'auth/unauthorized-domain') return T.authDomain;
  if (c === 'auth/operation-not-allowed') return T.authMethod;
  if (c === 'auth/network-request-failed') return T.authNetwork;
  return T.authFailed(e && e.message ? e.message : T.unknownError);
}

function startApp() {
  show('app');
  buildTabs();
  refreshData();
}

async function boot() {
  applyStaticText();
  buildTabs();
  if (DEMO) {
    $('#demoTag').hidden = false; $('#whoBox').hidden = true;
    startApp();
    return;
  }
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
    const [appM, fsM, authM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), REQUIRE_LOGIN ? import(base + 'firebase-auth.js') : null]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    db = fsM.getFirestore(app); FS = fsM;
    if (REQUIRE_LOGIN) { auth = authM.getAuth(app); auth.languageCode = LANG; AU = authM; }
  } catch (e) {
    console.error(e);
    if (REQUIRE_LOGIN) { show('auth'); $('#authMsg').textContent = T.firebaseFailed; }
    else { show('app'); setStatus(T.firebaseFailed, 'err'); }
    return;
  }
  if (!REQUIRE_LOGIN) { $('#whoBox').hidden = true; startApp(); return; }
  AU.onAuthStateChanged(auth, user => {
    if (user) { $('#who').textContent = user.email || T.signedIn; startApp(); }
    else { cache.clear(); state.keys = []; $('#pw').value = ''; show('auth'); }
  });
}

$('#googleBtn').onclick = async () => {
  $('#authMsg').textContent = '';
  try { await AU.signInWithPopup(auth, new AU.GoogleAuthProvider()); }
  catch (e) { $('#authMsg').textContent = authMessage(e); }
};
$('#pwForm').onsubmit = async ev => {
  ev.preventDefault();
  const email = $('#em').value.trim(), pw = $('#pw').value;
  if (!email || !pw) { $('#authMsg').textContent = T.enterEmailPw; return; }
  $('#authMsg').textContent = '';
  try { await AU.signInWithEmailAndPassword(auth, email, pw); }
  catch (e) { $('#authMsg').textContent = authMessage(e); }
};
const doSignOut = async () => { try { await AU.signOut(auth); } catch (e) { console.error(e); } };
$('#signOut').onclick = doSignOut;
$('#deniedOut').onclick = doSignOut;

$('#tabs').onclick = e => {
  const b = e.target.closest('[data-t]');
  if (!b) return;
  state.tab = b.dataset.t;
  $('#tabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', x === b));
  if (state.keys.length || state.tab === 'now' || state.tab === 'weekly') renderPanel();
};
$('#presets').onclick = e => {
  const b = e.target.closest('[data-p]');
  if (!b) return;
  state.preset = b.dataset.p;
  $('#presets').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('#customDates').hidden = state.preset !== 'custom';
  if (state.preset === 'custom') {
    if (!$('#dTo').value) { $('#dTo').value = dateToIso(todayDate()); $('#dFrom').value = dateToIso(addDays(todayDate(), -13)); }
    state.customStart = $('#dFrom').value; state.customEnd = $('#dTo').value;
  }
  refreshData();
};
$('#applyRange').onclick = () => { state.customStart = $('#dFrom').value; state.customEnd = $('#dTo').value; refreshData(); };
$('#refresh').onclick = () => {
  if (state.tab === 'weekly' && state.wk.start) {
    const s = isoToDate(state.wk.start);
    keysBetween(addDays(s, -7), addDays(s, 6)).forEach(k => cache.delete(k));
  }
  refreshData(true);
};
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!$('#app').hidden && state.keys.length) renderPanel(); });
}

document.addEventListener('click', e => { const b = e.target.closest('.lang [data-lang]'); if (b) setLang(b.dataset.lang); });

boot();
</script>
</body>
